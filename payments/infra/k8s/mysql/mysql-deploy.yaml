apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-payments
  labels:
    app: mysql-payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-payments
  template:
    metadata:
      labels:
        app: mysql-payments
    spec:
      containers:
        - name: mysql-payments
          image: mysql:9.7@sha256:30a0abfa7b502a496e12339b54cd07aaa70363396dc4b8e8a72a92804a505cd6
          envFrom:
            - secretRef:
                name: mysql-payments-secret
            - configMapRef:
                name: mysql-payments-configmap
          volumeMounts:
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
          securityContext:
            privileged: true
          ports:
            - containerPort: 3306
      volumes:
        - name: init-sql
          configMap:
            name: mysql-payments-init-sql
            items:
              - key: init.sql
                path: init.sql