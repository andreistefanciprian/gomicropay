apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-payments
  labels:
    app: mysql-payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-payments
  template:
    metadata:
      labels:
        app: mysql-payments
    spec:
      containers:
        - name: mysql-payments
          image: mysql:9.7@sha256:1f2ca53a9e94ff9f1f313099fa7dc7fb2f72e180ca5b2ef83574031e451bbbf1
          envFrom:
            - secretRef:
                name: mysql-payments-secret
            - configMapRef:
                name: mysql-payments-configmap
          volumeMounts:
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
          securityContext:
            privileged: true
          ports:
            - containerPort: 3306
      volumes:
        - name: init-sql
          configMap:
            name: mysql-payments-init-sql
            items:
              - key: init.sql
                path: init.sql